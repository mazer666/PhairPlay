name: Build PhairPlay APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ИСПРАВЛЕНО: Добавлен параметр wrapper-validation: false, чтобы отключить упавшую проверку
      - name: Setup Gradle cache & tools
        uses: gradle/actions/setup-gradle@v4
        with:
          wrapper-validation: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages (including NDK & CMake)
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;28.2.13676358"
          sdkmanager "cmake;3.22.1"

      - name: Configure Android SDK and NDK paths
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> local.properties

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Google TV Debug APK
        run: ./gradlew :app:assembleGoogletvDebug --no-daemon

      - name: Upload Google TV APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: PhairPlay-googletv-debug
          path: app/build/outputs/apk/googletv/debug/*.apk
          if-no-files-found: error
