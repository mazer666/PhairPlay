name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate (repository structure)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make the check scripts executable
        run: chmod +x scripts/check-file-size.sh scripts/check-kdoc-headers.sh scripts/check-docs-links.sh scripts/check-i18n-completeness.sh

      # The four scripts are the machine-readable form of the project rules in
      # docs/CONTRIBUTING.md. Every one of them exits 1 when it finds a
      # violation, so a red script makes the job — and the build — red.
      # All four run even if an earlier one fails, so one push shows the
      # complete list of problems instead of one problem per push.
      # The KDoc check runs with --skip-nested, because a nested declaration is
      # documented by the KDoc header of the class that contains it.
      # The strict run of the same script is green as well; both exit codes are
      # recorded in docs/acceptance/QA-QUALITY-GATE-ACCEPTANCE.md.
      - name: Run the repository structure checks
        run: |
          status=0
          for check in \
            check-file-size \
            check-kdoc-headers \
            check-docs-links \
            check-i18n-completeness
          do
            args=()
            if [ "$check" = "check-kdoc-headers" ]; then
              args=(--skip-nested)
            fi
            # The file size rule of docs/CONTRIBUTING.md applies to every source
            # file, not only to Kotlin. The shell scripts of scripts/ are source
            # code too, so they are checked with the same limits.
            if [ "$check" = "check-file-size" ]; then
              args=(--ext .kt --ext .sh)
            fi
            echo "::group::scripts/$check.sh ${args[*]:-}"
            if "./scripts/$check.sh" "${args[@]}"; then
              echo "PASS: scripts/$check.sh ${args[*]:-}"
            else
              echo "FAIL: scripts/$check.sh ${args[*]:-}"
              status=1
            fi
            echo "::endgroup::"
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::At least one structure check failed. See the log above for the file and line numbers."
          fi
          exit "$status"

  jvm-tests:
    name: JVM protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run JVM protocol test suite
        run: ./gradlew :test-runner:test --stacktrace

      - name: Upload JVM test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-report
          path: test-runner/build/reports/tests/test/
          retention-days: 30
          if-no-files-found: ignore

  android-build:
    name: Android lint & debug APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: googletv
            lint_task: :app:lintGoogletvDebug
            assemble_task: :app:assembleGoogletvDebug
            apk_path: app/build/outputs/apk/googletv/debug/app-googletv-debug.apk
          - flavor: firetv
            lint_task: :app:lintFiretvDebug
            assemble_task: :app:assembleFiretvDebug
            apk_path: app/build/outputs/apk/firetv/debug/app-firetv-debug.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Lint and build debug APKs
        run: ./gradlew ${{ matrix.lint_task }} ${{ matrix.assemble_task }} --stacktrace

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk-${{ matrix.flavor }}
          path: ${{ matrix.apk_path }}
          retention-days: 7
          if-no-files-found: error
